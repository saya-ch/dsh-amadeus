# Amadeus: Whale — fully independent plugin. Own gateway, own port, own files.
- insert:
    - id: amadeus
      name: dsh-amadeus
      inject: [webServer, connection, tools, sessionQuery, sessionController, workspaceRegistry]
      config:
        stateFile: !!js dshHomePath('amadeus/devices.json')
        controlFile: !!js dshHomePath('amadeus/control.json')
        initiallyEnabled: false
        listenHost: 127.0.0.1
        listenPort: 3444
        upstreamOrigin: http://127.0.0.1:3080
        allowedCidrs: [127.0.0.0/8]
        tls:
          mode: disabled

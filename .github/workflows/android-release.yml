name: Android Release

# 触发：推送 app-v* tag（如 app-v0.1.0），或手动指定版本号
on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（x.y.z，如 0.1.0）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK 且许可已接受；不再用 setup-android
      # （其默认 packages 含已被 SDK 仓库移除的 `tools`，会直接报错退出）

      - name: 解析版本号
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            NAME="${{ inputs.version }}"
          else
            NAME="${GITHUB_REF_NAME#app-v}"
          fi
          if ! printf '%s' "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号必须是 x.y.z 形式，收到：$NAME"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$NAME"
          {
            echo "name=$NAME"
            echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))"
            echo "tag=app-v$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "版本 $NAME（versionCode $((MAJOR * 10000 + MINOR * 100 + PATCH))）"

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.AMADEUS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 secret AMADEUS_KEYSTORE_BASE64（见 docs/发布流程.md）"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/amadeus-release.jks"

      - name: 单元测试
        working-directory: app/amadeus-android
        run: ./gradlew :app:testReleaseUnitTest --console=plain

      - name: 构建 Release APK
        working-directory: app/amadeus-android
        env:
          AMADEUS_KEYSTORE_FILE: ${{ runner.temp }}/amadeus-release.jks
          AMADEUS_KEYSTORE_PASSWORD: ${{ secrets.AMADEUS_KEYSTORE_PASSWORD }}
          AMADEUS_KEY_ALIAS: ${{ secrets.AMADEUS_KEY_ALIAS }}
          AMADEUS_KEY_PASSWORD: ${{ secrets.AMADEUS_KEY_PASSWORD }}
          AMADEUS_VERSION_NAME: ${{ steps.version.outputs.name }}
          AMADEUS_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk amadeus.apk
          ls -lh amadeus.apk

      - name: 校验签名
        working-directory: app/amadeus-android
        run: |
          set -euo pipefail
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs amadeus.apk

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Amadeus App v${{ steps.version.outputs.name }}
          files: app/amadeus-android/amadeus.apk
          generate_release_notes: true
          draft: false
          prerelease: false
